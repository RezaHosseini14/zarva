services:
  postgres:
    image: postgres:16-alpine
    container_name: zarva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zarva_db}
      POSTGRES_USER: ${POSTGRES_USER:-zarva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - zarva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zarva} -d $${POSTGRES_DB:-zarva_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - zarva-net

  redis:
    image: redis:7-alpine
    container_name: zarva-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes --appendfsync everysec --maxmemory \"$${REDIS_MAXMEMORY:-128mb}\" --maxmemory-policy volatile-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}
    volumes:
      - zarva_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - zarva-net

  minio:
    # Docker Hub minio pulls often fail on IR VPS; Arvan mirror matches cached host images.
    image: ${MINIO_IMAGE:-docker.arvancloud.ir/minio/minio:RELEASE.2022-10-24T18-35-07Z}
    container_name: zarva-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-zarva}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-zarva-secret-key}
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports:
      - "${MINIO_PUBLIC_PORT:-9020}:9000"
      - "${MINIO_CONSOLE_PORT:-9021}:9001"
    volumes:
      - zarva_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - zarva-net

  backend:
    image: ${BACKEND_IMAGE}
    container_name: zarva-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5030}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-zarva}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zarva_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-24h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-mock}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-zarva}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-zarva-secret-key}
      MINIO_BUCKET: ${MINIO_BUCKET:-zarva}
      MINIO_USE_SSL: "false"
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      APP_URL: ${APP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-ZARVA <noreply@zarva.dev>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - zarva_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - zarva-net

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: zarva-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5031}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_URL: http://backend:3000/api/v1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - zarva-net

  nginx:
    image: nginx:1.27-alpine
    container_name: zarva-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-5032}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zarva-net

networks:
  zarva-net:
    driver: bridge

volumes:
  zarva_pgdata:
  zarva_redisdata:
  zarva_miniodata:
  zarva_data:
