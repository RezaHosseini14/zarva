name: CD

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile -t ghcr.io/${{ github.repository }}/backend:latest .
      - name: Build frontend image
        run: docker build -f apps/frontend/Dockerfile -t ghcr.io/${{ github.repository }}/frontend:latest .
      - name: Push
        run: |
          docker push ghcr.io/${{ github.repository }}/backend:latest
          docker push ghcr.io/${{ github.repository }}/frontend:latest
