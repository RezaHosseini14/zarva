name: Bootstrap helali self-hosted runner

on:
  workflow_dispatch:
    inputs:
      registration_token:
        description: Optional — paste from helali emit-runner workflow (else uses HELALI_RUNNER_ADMIN_PAT)
        required: false
        type: string
  repository_dispatch:
    types: [helali-runner-bootstrap]

permissions:
  contents: read

jobs:
  register-helali-vps:
    name: Register helali-vps on this host
    runs-on: [self-hosted, zarva]
    timeout-minutes: 15
    steps:
      - name: Checkout helali (register script)
        uses: actions/checkout@v4
        with:
          repository: RezaHosseini14/helali
          ref: main
          path: helali

      - name: Resolve helali runner registration token
        id: reg
        env:
          HELALI_ADMIN_PAT: ${{ secrets.HELALI_RUNNER_ADMIN_PAT }}
          INPUT_TOKEN: ${{ inputs.registration_token || github.event.client_payload.registration_token }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TOKEN:-}" ]; then
            echo "::add-mask::${INPUT_TOKEN}"
            echo "token=${INPUT_TOKEN}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${HELALI_ADMIN_PAT:-}" ]; then
            echo "::error::Pass registration_token workflow input, or add zarva secret HELALI_RUNNER_ADMIN_PAT."
            exit 1
          fi
          TOKEN=$(curl -fsSL -X POST \
            -H "Authorization: Bearer ${HELALI_ADMIN_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/RezaHosseini14/helali/actions/runners/registration-token" \
            | jq -r '.token')
          test -n "$TOKEN" && test "$TOKEN" != null
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Register Actions runner (helali-vps)
        env:
          REGISTRATION_TOKEN: ${{ steps.reg.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$REGISTRATION_TOKEN"
          sudo mkdir -p /opt/helali /opt/actions-runner-helali
          sudo env REGISTRATION_TOKEN="$REGISTRATION_TOKEN" bash "$GITHUB_WORKSPACE/helali/scripts/register-helali-runner-on-vps.sh"
          echo "helali-vps registered — https://github.com/RezaHosseini14/helali/settings/actions/runners"
