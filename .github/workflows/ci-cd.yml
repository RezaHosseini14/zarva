name: zarva CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: zarva-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REMOTE_DIR: /opt/zarva

jobs:
  validate:
    name: Quality Gate (Build, Lint & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint --if-present

      - name: Run Tests
        run: npm run test --if-present

      - name: Run Build
        run: npm run build

  build-backend:
    name: Docker Backend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/zarva-backend"
          TAG="${{ github.sha }}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "ref=${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Docker Frontend (Build & GHCR Push)
    needs: [validate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_ref: ${{ steps.meta.outputs.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image coordinates
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER}/zarva-frontend"
          TAG="${{ github.sha }}"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "ref=${IMAGE}:${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.ref }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://zarva.rmhosseini.ir/api/v1
            NEXT_PUBLIC_APP_URL=https://zarva.rmhosseini.ir
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  preflight:
    name: Deployment Preflight
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      deploy_enabled: ${{ steps.check.outputs.deploy_enabled }}

    steps:
      - name: Detect deployment credentials
        id: check
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_RUNS_ON: ${{ vars.DEPLOY_RUNS_ON }}
        run: |
          if [ -n "${SSH_PRIVATE_KEY}" ] || echo "${DEPLOY_RUNS_ON:-}" | grep -q 'self-hosted'; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
            echo "Deployment credentials / self-hosted runner config detected."
          else
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SSH_PRIVATE_KEY is not configured (and DEPLOY_RUNS_ON is not self-hosted). Skipping production deployment."
          fi

  deploy:
    name: Deploy to Production VPS
    needs: [build-backend, build-frontend, preflight]
    if: github.event_name != 'pull_request' && needs.preflight.outputs.deploy_enabled == 'true'
    # Default: GitHub-hosted (SSH into VPS). For IR / firewalled VPS set repo variable:
    #   DEPLOY_RUNS_ON = ["self-hosted","zarva"]
    # and register a runner on the VPS with labels self-hosted,zarva — then deploy runs ON the box (no inbound SSH).
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || '109.70.78.80' }}
      SSH_USER: ${{ secrets.SSH_USER || 'root' }}
      TLS_HOST: ${{ secrets.TLS_HOST || 'zarva.rmhosseini.ir' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deploy mode
        id: mode
        run: |
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "--> Deploy mode: LOCAL (self-hosted runner on the VPS)"
          else
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
            echo "--> Deploy mode: SSH from GitHub-hosted runner → ${SSH_USER}@${SSH_HOST}:${SSH_PORT}"
          fi

      - name: Validate required secrets (SSH mode)
        if: steps.mode.outputs.mode == 'ssh'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST" || { echo "::error::Missing SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::Missing SSH_USER"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::Missing secret SSH_PRIVATE_KEY"; exit 1; }
          P="${SSH_PORT:-22}"
          case "$P" in
            ''|*[!0-9]*)
              echo "::error::SSH_PORT must be a positive integer (1-65535), got: ${P}"
              exit 1
              ;;
          esac
          if [ "$P" -lt 1 ] || [ "$P" -gt 65535 ]; then
            echo "::error::SSH_PORT out of range: ${P}"
            exit 1
          fi
          echo "SSH_FLAGS=-o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o StrictHostKeyChecking=accept-new -p ${P}" >> "$GITHUB_ENV"
          echo "--> SSH target: ${SSH_USER}@${SSH_HOST} port ${P}; TLS_HOST=${TLS_HOST}"

      - name: Preflight TCP reachability (SSH mode)
        if: steps.mode.outputs.mode == 'ssh'
        run: |
          set -euo pipefail
          P="${SSH_PORT:-22}"
          echo "--> Probing ${SSH_HOST}:${P} from this GitHub runner..."
          if command -v nc >/dev/null 2>&1; then
            ok=0
            for i in 1 2 3; do
              if nc -z -w 8 "$SSH_HOST" "$P"; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              echo "::error::TCP ${SSH_HOST}:${P} is unreachable from GitHub Actions (timeout)."
              echo "::error::Your home PC can reach the VPS, but GitHub runners (US/EU) cannot — usually panel firewall / provider geo-block."
              echo "::error::Fix A (recommended): register a self-hosted runner ON the VPS with labels self-hosted,zarva and set repo variable DEPLOY_RUNS_ON to [\"self-hosted\",\"zarva\"]."
              echo "::error::Fix B: open inbound TCP ${P} to 0.0.0.0/0 in the VPS panel firewall (and ufw), then ensure authorized_keys has the zarva CI public key."
              echo "::error::See DEPLOYMENT.md § SSH from GitHub Actions."
              exit 1
            fi
          else
            echo "WARN: nc not available; skipping TCP preflight"
          fi
          echo "--> TCP ${SSH_HOST}:${P} is reachable from this runner"

      - name: Setup SSH agent
        if: steps.mode.outputs.mode == 'ssh'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        if: steps.mode.outputs.mode == 'ssh'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat <<'EOF' > ~/.ssh/config
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 20
            TCPKeepAlive yes
            ConnectTimeout 30
            StrictHostKeyChecking accept-new
          EOF
          ssh-keyscan -H -T 20 -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "WARN: ssh-keyscan failed; host key will be verified via accept-new"
          }
          chmod 600 ~/.ssh/known_hosts ~/.ssh/config 2>/dev/null || true

      - name: Sync compose + nginx (SSH)
        if: steps.mode.outputs.mode == 'ssh'
        run: |
          set -euo pipefail
          retry() {
            local attempt=1
            local max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Command failed after ${max} attempts: $*"
                echo "::error::If this is Permission denied: add id_ed25519_zarva_ci.pub to ~/.ssh/authorized_keys on the VPS (see DEPLOYMENT.md)."
                return 1
              fi
              echo "Attempt ${attempt} failed. Retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          # shellcheck disable=SC2086
          retry ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DIR/docker $REMOTE_DIR/data $REMOTE_DIR/docker/certs && chown -R 1001:1001 $REMOTE_DIR/data 2>/dev/null || true"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker-compose.yml"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS docker/nginx.conf "$SSH_USER@$SSH_HOST:$REMOTE_DIR/docker/nginx.conf"
          # shellcheck disable=SC2086
          retry scp $SSH_FLAGS scripts/ci-deploy-on-host.sh "$SSH_USER@$SSH_HOST:$REMOTE_DIR/ci-deploy-on-host.sh"
          # shellcheck disable=SC2086
          retry ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "chmod +x $REMOTE_DIR/ci-deploy-on-host.sh; test -f $REMOTE_DIR/config.json || printf '{}\n' > $REMOTE_DIR/config.json"

      - name: Sync compose + nginx (local / self-hosted)
        if: steps.mode.outputs.mode == 'local'
        run: |
          set -euo pipefail
          mkdir -p "$REMOTE_DIR/docker" "$REMOTE_DIR/data" "$REMOTE_DIR/docker/certs"
          chown -R 1001:1001 "$REMOTE_DIR/data" 2>/dev/null || true
          cp docker-compose.prod.yml "$REMOTE_DIR/docker-compose.yml"
          cp docker/nginx.conf "$REMOTE_DIR/docker/nginx.conf"
          cp scripts/ci-deploy-on-host.sh "$REMOTE_DIR/ci-deploy-on-host.sh"
          chmod +x "$REMOTE_DIR/ci-deploy-on-host.sh"
          test -f "$REMOTE_DIR/config.json" || printf '{}\n' > "$REMOTE_DIR/config.json"

      - name: Pull images & rolling restart on server
        env:
          BACKEND_IMAGE: ${{ needs.build-backend.outputs.image_ref }}
          FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image_ref }}
          # GHCR login user must match image owner (lowercase); token falls back to GITHUB_TOKEN for self-hosted / CI pull.
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          DEPLOY_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_MODE" = "local" ]; then
            echo "--> Running host deploy script locally in $REMOTE_DIR"
            BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
              GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" \
              REMOTE_DIR="$REMOTE_DIR" TLS_HOST="$TLS_HOST" \
              bash "$REMOTE_DIR/ci-deploy-on-host.sh"
          else
            run_remote_deploy() {
              # shellcheck disable=SC2086
              ssh $SSH_FLAGS \
                "$SSH_USER@$SSH_HOST" \
                BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
                GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" REMOTE_DIR="$REMOTE_DIR" \
                TLS_HOST="$TLS_HOST" \
                bash "$REMOTE_DIR/ci-deploy-on-host.sh"
            }
            attempt=1
            max=3
            until run_remote_deploy; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Remote rollout failed after ${max} attempts"
                exit 1
              fi
              echo "Remote rollout attempt ${attempt} failed. Retrying in $((attempt * 10))s..."
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          fi

      - name: Production Health Check Verification
        env:
          DEPLOY_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -uo pipefail

          check_containers() {
            set -euo pipefail
            missing=0
            for c in zarva-backend zarva-frontend zarva-nginx; do
              if docker ps --format '{{.Names}}' | grep -qx "$c"; then
                echo "OK running: $c"
              else
                echo "::error::Missing running container: $c"
                missing=1
              fi
            done
            echo "=== docker ps (zarva) ==="
            docker ps -a --filter name=zarva --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}'
            if [ "$missing" -ne 0 ]; then
              echo "::error::App containers are not running — the rolling restart step did not leave a live stack"
              exit 1
            fi
          }

          echo "--> Confirming app containers exist on the VPS..."
          if [ "$DEPLOY_MODE" = "local" ]; then
            check_containers
          else
            # shellcheck disable=SC2086
            ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          missing=0
          for c in zarva-backend zarva-frontend zarva-nginx; do
            if docker ps --format '{{.Names}}' | grep -qx "$c"; then
              echo "OK running: $c"
            else
              echo "::error::Missing running container: $c"
              missing=1
            fi
          done
          echo "=== docker ps (zarva) ==="
          docker ps -a --filter name=zarva --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}'
          if [ "$missing" -ne 0 ]; then
            echo "::error::App containers are not running — the rolling restart step did not leave a live stack"
            exit 1
          fi
          REMOTE
          fi

          # Prefer public domain (host nginx :443); fall back to docker gateway :1032
          HEALTH_URLS=(
            "https://${TLS_HOST}/api/v1/health"
            "https://127.0.0.1/api/v1/health"
            "https://127.0.0.1:1032/api/v1/health"
          )
          HOME_URLS=(
            "https://${TLS_HOST}/"
            "https://127.0.0.1/"
            "https://127.0.0.1:1032/"
          )
          echo "Verifying stack (domain ${TLS_HOST} or local nginx / :1032)..."
          STACK_UP=false
          for i in $(seq 1 40); do
            for idx in 0 1 2; do
              h="${HEALTH_URLS[$idx]}"
              p="${HOME_URLS[$idx]}"
              if curl -kfsS --connect-timeout 5 "$h" >/dev/null \
                && curl -kfsS --connect-timeout 5 "$p" >/dev/null; then
                STACK_UP=true
                echo "Healthy via $h (attempt $i)"
                curl -kfsS "$h"
                echo ""
                break 2
              fi
            done
            echo "Waiting for health... ($i/40)"
            sleep 3
          done

          if [ "$STACK_UP" = false ]; then
            echo "::error::Deployment health check failed for ${TLS_HOST} (and local :443 / :1032)"
            echo "=== Container status (best effort) ==="
            if [ "$DEPLOY_MODE" = "local" ]; then
              docker ps -a --filter name=zarva || true
              docker logs zarva-frontend --tail 60 || true
              docker logs zarva-backend --tail 60 || true
              docker logs zarva-nginx --tail 60 || true
            else
              # shellcheck disable=SC2086
              ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker ps -a --filter name=zarva" || true
              # shellcheck disable=SC2086
              ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker logs zarva-frontend --tail 60" || true
              # shellcheck disable=SC2086
              ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker logs zarva-backend --tail 60" || true
              # shellcheck disable=SC2086
              ssh $SSH_FLAGS "$SSH_USER@$SSH_HOST" "docker logs zarva-nginx --tail 60" || true
            fi
            exit 1
          fi

          echo "All services deployed and verified successfully!"

      - name: Publish Deployment Summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## zarva Production Deployment Report

          | Component | Status | URL |
          |---|---|---|
          | **Gateway** | Live | [https://${{ env.TLS_HOST }}](https://${{ env.TLS_HOST }}) |
          | **Health Check** | Healthy | [https://${{ env.TLS_HOST }}/api/v1/health](https://${{ env.TLS_HOST }}/api/v1/health) |
          | **Swagger** | Ready | [https://${{ env.TLS_HOST }}/api/docs](https://${{ env.TLS_HOST }}/api/docs) |

          - **Git SHA**: \`${{ github.sha }}\`
          - **Triggered By**: @${{ github.actor }}
          - **Target VPS (SSH)**: \`${{ env.SSH_USER }}@${{ env.SSH_HOST }}:${{ env.SSH_PORT }}\` — **public URL host**: \`${{ env.TLS_HOST }}\` (\`/opt/zarva\`)
          - **Gateway**: nginx on \`:1032\` → backend \`/api\`+\`/socket.io\`, frontend \`/\`
          - **Direct ports**: backend \`:1030\`, frontend \`:1031\`
          - **Backend Image**: \`${{ needs.build-backend.outputs.image_ref }}\`
          - **Frontend Image**: \`${{ needs.build-frontend.outputs.image_ref }}\`
          EOF
